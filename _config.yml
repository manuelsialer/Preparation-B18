# Configuración del Libro - Material Preuniversitario Beca 18
title: Material Preuniversitario Beca 18 – Alto Rendimiento
author: MSF
copyright: "2026"

execute:
  execute_notebooks: 'off'

repository:
  url: https://github.com/manuelsialer/Preparation-B18
  path_to_book: "."
  branch: main

html:
  use_issues_button: true
  use_repository_button: true
  extra_navbar: '<p>Preparación Integral Beca 18 / Preuniversitaria</p>'

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - deflist
    - html_image
    - colon_fence

exclude_patterns:
  - ".agents/*"
  - ".agents/**/*"
  - "temarios/*"
  - "scratch/*"
  - "requirements.txt"
  - "LICENSE"
  - "README.md"
  - "docs/*"

